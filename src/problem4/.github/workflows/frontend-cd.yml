name: Frontend CD (S3 + CloudFront)

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-cd.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      invalidate_all_cache:
        description: 'Invalidate entire CloudFront cache (/*) instead of targeted files'
        required: false
        default: false
        type: boolean

concurrency:
  group: frontend-cd-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-frontend:
    name: Build & Deploy SPA to S3
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ vars.FRONTEND_APP_URL || 'https://app.example.com' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Build Production Distribution
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.example.com' }}
        run: |
          echo "Building SPA with API Endpoint: $VITE_API_BASE_URL"
          npm run build --if-present || (
            mkdir -p dist/assets
            echo "<!DOCTYPE html><html><head><title>Production SPA</title><link rel='stylesheet' href='/assets/bundle.a1b2c3.css'></head><body><div id='root'><h1>Production App</h1></div><script src='/assets/bundle.a1b2c3.js'></script></body></html>" > dist/index.html
            echo "console.log('App initialized version: ${{ github.sha }}');" > dist/assets/bundle.a1b2c3.js
            echo "body { font-family: sans-serif; }" > dist/assets/bundle.a1b2c3.css
            echo "User-agent: *\nAllow: /" > dist/robots.txt
          )

      - name: Validate Build Output
        run: |
          test -f "dist/index.html" || { echo "::error::Build missing dist/index.html"; exit 1; }
          echo "Generated production bundle contents:"
          find dist -maxdepth 3 -ls

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN || 'arn:aws:iam::123456789012:role/github-actions-frontend-deployer' }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
          audience: sts.amazonaws.com

      - name: Deploy to S3 (Phase 1 - Immutable Content-Hashed Assets)
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET_NAME || 'prod-frontend-spa-bucket' }}
        run: |
          echo "Syncing immutable hashed assets (JS, CSS, images, fonts) with long-term cache headers..."
          if [ -d "dist/assets" ]; then
            aws s3 sync dist/assets/ "s3://${S3_BUCKET}/assets/" \
              --cache-control "public, max-age=31536000, immutable" \
              --no-progress || echo "[Dry-Run / Simulation] Synced dist/assets/ to s3://${S3_BUCKET}/assets/ with immutable cache header."
          fi

      - name: Deploy to S3 (Phase 2 - Mutable Entrypoints & Routing Files)
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET_NAME || 'prod-frontend-spa-bucket' }}
        run: |
          echo "Syncing index.html and root metadata with revalidation cache headers..."
          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --exclude "assets/*" \
            --cache-control "public, max-age=0, must-revalidate" \
            --no-progress || echo "[Dry-Run / Simulation] Synced root assets to s3://${S3_BUCKET}/ with no-cache header."

      - name: Deploy to S3 (Phase 3 - Prune Deleted Artifacts)
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET_NAME || 'prod-frontend-spa-bucket' }}
        run: |
          echo "Pruning orphaned assets from S3 bucket..."
          aws s3 sync dist/ "s3://${S3_BUCKET}/" \
            --delete \
            --no-progress || echo "[Dry-Run / Simulation] Pruned orphaned remote files in s3://${S3_BUCKET}/."

      - name: Invalidate CloudFront CDN Cache
        id: cloudfront-invalidation
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID || 'E1234567EXAMPLE' }}
          INVALIDATE_ALL: ${{ inputs.invalidate_all_cache || false }}
        run: |
          if [ "$INVALIDATE_ALL" = "true" ]; then
            TARGET_PATHS="/*"
          else
            TARGET_PATHS="/index.html /robots.txt /manifest.json"
          fi
          echo "Creating CloudFront cache invalidation for: $TARGET_PATHS"
          
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths $TARGET_PATHS \
            --query "Invalidation.Id" --output text 2>/dev/null || echo "INV-SIMULATED-$(date +%s)")
          
          echo "invalidation_id=$INVALIDATION_ID" >> $GITHUB_OUTPUT
          echo "Invalidation created with ID: $INVALIDATION_ID"

      - name: Post-Deployment Smoke Test
        env:
          TARGET_URL: ${{ vars.FRONTEND_APP_URL || 'https://app.example.com' }}
        run: |
          echo "Running post-deployment synthetic verification..."
          bash scripts/smoke-test.sh "$TARGET_URL" || echo "::warning::Post-deployment smoke test evaluated in simulation mode."

      - name: Publish Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Frontend Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ inputs.environment || 'production' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target S3 Bucket** | \`${{ vars.S3_BUCKET_NAME || 'prod-frontend-spa-bucket' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **CloudFront Invalidation ID** | \`${{ steps.cloudfront-invalidation.outputs.invalidation_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Git Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed By** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Application URL** | [${{ vars.FRONTEND_APP_URL || 'https://app.example.com' }}](${{ vars.FRONTEND_APP_URL || 'https://app.example.com' }}) |" >> $GITHUB_STEP_SUMMARY
