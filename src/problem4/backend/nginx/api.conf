# EC2 Host Reverse Proxy Configuration (NGINX)
# Location on EC2: /etc/nginx/conf.d/api.conf

# Upstream definition dynamically updated by /opt/app/scripts/deploy.sh
# Points to 127.0.0.1:8080 (Blue) or 127.0.0.1:8081 (Green)
include /etc/nginx/conf.d/upstream.inc;

server {
    listen 80;
    server_name api.example.com _;

    # Client payload size limits
    client_max_body_size 10M;

    # Performance & Timeouts
    keepalive_timeout 65;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Health check passthrough (No proxy buffering for instant readiness)
    location /health {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # API Traffic Routing
    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mitigate slow clients
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }
}
